[project]
name = "usim"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "nop", email = "noplab90@gmail.com" }]
description = "General-purpose robot simulation interfaces, configuration and CLI"
requires-python = ">=3.10,<3.15"
dependencies = []

[project.scripts]
usim = "usim.cli:main"
usim-sim-node = "usim.bridges.simulation_ros2:main"

[project.optional-dependencies]
genesis = ["usim-genesis[native]==0.1.0"]
maniskill = ["usim-maniskill[native]==0.1.0"]
gazebo = ["usim-gazebo[state]==0.1.0"]
bullet = ["usim-bullet[native]==0.1.0"]
mujoco = ["usim-mujoco[native]==0.1.0"]
mujoco-warp = ["usim-mujoco[warp]==0.1.0"]
usd = ["usim-isaacsim[usd]==0.1.0"]
isaac = ["usim-isaacsim[native]==0.1.0"]
cad = ["cadquery-ocp-novtk==7.9.3.1.1"]
pipeline = [
  "numpy==1.26.4; python_version < '3.13'",
  "numpy==2.5.4; python_version >= '3.13'",
  "scipy==1.15.3; python_version < '3.13'",
  "scipy==1.18.1; python_version >= '3.13'",
  "open3d==0.19.0; python_version < '3.13'",
  "open3d==0.20.0; python_version >= '3.13'",
  "usd-core==25.5.1; python_version < '3.13'",
  "usd-core==26.11; python_version >= '3.13'",
  "scikit-image==0.25.2; python_version < '3.14'",
  "scikit-image==0.26.0; python_version >= '3.14'",
  "shapely==2.1.2",
  "pymeshlab==2025.7.post1",
  "matplotlib==3.10.8",
  "anyio==4.14.2",
  "typing-extensions==4.16.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1,<10",
  "numpy>=1.26,<3",
  "scipy>=1.15,<2",
  "open3d==0.19.0; python_version < '3.13'",
  "open3d==0.20.0; python_version >= '3.13'",
  "anyio==4.14.2",
  "typing-extensions==4.16.0",
  "tomli==2.5.0; python_version < '3.11'",
  "ruff==0.16.9",
  "usim-genesis==0.1.0",
  "usim-maniskill==0.1.0",
  "usim-isaacsim==0.1.0",
  "usim-gazebo==0.1.0",
  "usim-bullet==0.1.0",
  "usim-mujoco==0.1.0",
]

[tool.uv]
extra-index-url = ["https://pypi.nvidia.com"]
index-strategy = "unsafe-best-match"
prerelease = "allow"
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
conflicts = [
  [{ extra = "usd" }, { extra = "isaac" }],
  [{ extra = "pipeline" }, { extra = "isaac" }],
  [{ extra = "pipeline" }, { extra = "usd" }],
  [{ extra = "pipeline" }, { extra = "maniskill" }],
  [{ extra = "pipeline" }, { package = "usim-maniskill", extra = "native" }],
  [{ extra = "maniskill" }, { extra = "isaac" }],
  [{ extra = "genesis" }, { extra = "isaac" }],
  [{ extra = "mujoco" }, { extra = "isaac" }],
  [{ extra = "mujoco-warp" }, { extra = "isaac" }],
  [{ extra = "mujoco" }, { package = "usim-isaacsim", extra = "native" }],
  [{ extra = "mujoco-warp" }, { package = "usim-isaacsim", extra = "native" }],
  [{ package = "usim-mujoco", extra = "native" }, { extra = "isaac" }],
  [{ package = "usim-mujoco", extra = "warp" }, { extra = "isaac" }],
  [{ package = "usim-mujoco", extra = "native" }, { package = "usim-isaacsim", extra = "native" }],
  [{ package = "usim-mujoco", extra = "warp" }, { package = "usim-isaacsim", extra = "native" }],
  [{ package = "usim-isaacsim", extra = "native" }, { package = "usim-isaacsim", extra = "usd" }],
  [{ package = "usim-isaacsim", extra = "native" }, { extra = "pipeline" }],
  [{ package = "usim-isaacsim", extra = "usd" }, { extra = "pipeline" }],
  [{ package = "usim-isaacsim", extra = "native" }, { package = "usim-genesis", extra = "native" }],
  [{ package = "usim-genesis", extra = "usd" }, { extra = "usd" }],
  [{ package = "usim-genesis", extra = "usd" }, { extra = "isaac" }],
  [{ package = "usim-genesis", extra = "usd" }, { package = "usim-isaacsim", extra = "usd" }],
  [{ package = "usim-genesis", extra = "usd" }, { package = "usim-isaacsim", extra = "native" }],
  [{ package = "usim-isaacsim", extra = "native" }, { package = "usim-maniskill", extra = "native" }],
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
usim-genesis = { workspace = true }
usim-maniskill = { workspace = true }
usim-isaacsim = { workspace = true }
usim-gazebo = { workspace = true }
usim-bullet = { workspace = true }
usim-mujoco = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usim", "src/usim_env", "src/usim_env_pipeline", "src/usim_env_vtc", "src/usim_env_tsudanuma"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src", "packages", "test", "scripts", "examples", "docs", "docker",
  "README.md", "pyproject.toml", "uv.lock", "LICENSE", "AGENTS.md", "pyrightconfig.json",
]
exclude = ["/runs", "/assets", "/.omo", "/.venv"]

[tool.ruff]
required-version = "==0.16.9"
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
python_files = ["test_*.py"]
