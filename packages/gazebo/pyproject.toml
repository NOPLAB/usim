[project]
name = "usim-gazebo"
version = "0.1.0"
description = "Gazebo engine for usim"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = ["usim==0.1.0"]

[project.entry-points."usim.runners"]
gazebo = "usim_gazebo:GazeboSimulator"

[tool.uv.sources]
usim = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usim_gazebo"]
