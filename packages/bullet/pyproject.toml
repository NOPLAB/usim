[project]
name = "usim-bullet"
version = "0.1.0"
description = "Bullet engine for usim"
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = ["usim==0.1.0"]

[project.optional-dependencies]
native = ["pybullet==3.2.7", "numpy>=1.26,<3"]

[project.entry-points."usim.backends"]
bullet = "usim_bullet.backend:Backend"

[project.entry-points."usim.simulators"]
bullet = "usim_bullet:BulletSimulator"

[tool.uv.sources]
usim = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usim_bullet"]
