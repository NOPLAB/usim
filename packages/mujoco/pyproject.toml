[project]
name = "usim-mujoco"
version = "0.1.0"
description = "Native MuJoCo CPU and MuJoCo Warp CUDA engines for usim"
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = ["usim==0.1.0"]

[project.optional-dependencies]
native = ["mujoco==3.17.0", "numpy>=1.26,<3"]
warp = [
  "mujoco==3.17.0",
  "mujoco-warp==3.17.0",
  "warp-lang==1.18.0",
  "numpy>=1.26,<3",
]

[project.entry-points."usim.backends"]
mujoco = "usim_mujoco:Backend"
mujoco-warp = "usim_mujoco:WarpBackend"

[project.entry-points."usim.simulators"]
mujoco = "usim_mujoco:MuJoCoSimulator"
mujoco-warp = "usim_mujoco:MuJoCoWarpSimulator"

[tool.uv.sources]
usim = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usim_mujoco"]
