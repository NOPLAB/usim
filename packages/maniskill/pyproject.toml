[project]
name = "usim-maniskill"
version = "0.1.0"
description = "ManiSkill engine for usim"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = ["usim==0.1.0"]

[project.optional-dependencies]
native = ["numpy>=1.26,<2", "mani-skill==3.0.1", "sapien==3.0.3"]

[project.entry-points."usim.simulators"]
maniskill = "usim_maniskill:ManiSkillSimulator"

[tool.uv.sources]
usim = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usim_maniskill"]
