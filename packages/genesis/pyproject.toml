[project]
name = "usim-genesis"
version = "0.1.0"
description = "Genesis engine for usim"
license = "MIT"
requires-python = ">=3.10,<3.15"
dependencies = ["usim==0.1.0"]

[project.optional-dependencies]
native = ["numpy>=1.26,<3", "genesis-world==1.4.3", "torch==2.13.0"]
usd = [
  "usd-core==25.5.1; python_version < '3.13'",
  "usd-core==26.11; python_version >= '3.13'",
]

[project.entry-points."usim.simulators"]
genesis = "usim_genesis:GenesisSimulator"

[project.entry-points."usim.backends"]
genesis = "usim_genesis.backend:Backend"

[tool.uv.sources]
usim = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usim_genesis"]
