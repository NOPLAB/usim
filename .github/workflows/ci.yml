name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install Open3D system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libgl1
      - name: Check Python style
        run: |
          uv run --group dev --frozen ruff check .
          uv run --group dev --frozen ruff format --check .
      - name: Run generic simulator tests
        run: uv run --group dev --frozen pytest -ra
      - name: Build independent distributions
        run: uv build --all-packages
      - name: Exercise installed wheel
        run: |
          uv venv --python '${{ matrix.python }}' /tmp/usim-wheel-qa
          trap 'rm -rf /tmp/usim-wheel-qa' EXIT
          uv pip install --python /tmp/usim-wheel-qa/bin/python dist/*.whl
          uv run --no-sync python scripts/smoke_installed.py --bin-dir /tmp/usim-wheel-qa/bin
